name: Generate patch releases

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # First day of every month
    - cron: '0 0 1 * *'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      latest_branch: ${{steps.latest_branch.outputs.latest_branch}}
      branches_json: ${{steps.release_branches.outputs.branches_json}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            fetch-depth: 0
      - name: Get latest llvm_release branch
        id: latest_branch
        run: |
          git branch -r \
          | grep 'ocl-open-' \
          | sed -E 's/.*\/ocl-open-([0-9]+)/\1/' \
          | sort -n -r \
          | head -1 \
          | xargs printf "latest_branch=ocl-open-%s" \
          >> $GITHUB_OUTPUT
      - name: Get branch list
        id: release_branches
        run: |
          git branch -r \
          | grep "origin/ocl-open-" \
          | sed -E 's/\ *origin\/([^\ ]*)/\"\1\"/' \
          | paste -sd',' \
          | xargs -0 -d"\n" printf 'branches_json={"branch":[%s]}' \
          >> $GITHUB_OUTPUT
  release:
    permissions:
      # required by softprops/action-gh-release to create a release
      contents: write
      # required by sigstore and attest-build-provenance for keyless signing
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix: ${{fromJson(needs.setup.outputs.branches_json)}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            ref: ${{ matrix.branch }}
            fetch-depth: 0
      - name: Get commits info
        id: versions
        run: |
            export LATEST_VERSION=\
            "$(git describe --tags --abbrev=0 --match 'v*')"
            export LLVM_VERSION=$(echo $LATEST_VERSION \
            | sed -E 's/v([0-9]+\.[0-9]+)\.([0-9]+).*/\1/')
            export PATCH=$(echo $LATEST_VERSION \
            | sed -E 's/(v[0-9]+\.[0-9]+)\.([0-9]+).*/\2/')
            echo "llvm_version=$LLVM_VERSION" >> $GITHUB_OUTPUT
            echo "patch=$PATCH" >> $GITHUB_OUTPUT
            echo "latest_version=${LATEST_VERSION}" >> $GITHUB_OUTPUT
            echo "release_version=${LLVM_VERSION}.$((${PATCH}+1))" \
            >> $GITHUB_OUTPUT
            git rev-list ${LATEST_VERSION}..HEAD --count \
            | xargs printf "commits_since_last_release=%d\n" >> $GITHUB_OUTPUT
            git rev-parse HEAD | xargs printf "last_commit=%s\n" >> $GITHUB_OUTPUT
      - name: Get SPIRV-LLVM-Translator and llvm-project latest tags
        id: llvm-spirv-versions
        run: |
          export SPIRV_PATCH=\
          $(git ls-remote --tags \
          "https://github.com/KhronosGroup/SPIRV-LLVM-Translator" \
          "refs/tags/v${{ steps.versions.outputs.llvm_version }}.[0-9]" \
          "refs/tags/v${{ steps.versions.outputs.llvm_version }}.[0-9][0-9]" \
          | awk '{print $2}' \
          | sed -E 's/refs\/tags\/v${{ steps.versions.outputs.llvm_version }}.([0-9]+)/\1/' \
          | sort -n \
          | tail -1)
          echo "spirv_patch=${SPIRV_PATCH}" >> $GITHUB_OUTPUT
          export LLVM_PATCH=\
          $(git ls-remote --tags \
          "https://github.com/llvm/llvm-project" \
          "refs/tags/llvmorg-${{ steps.versions.outputs.llvm_version }}.[0-9]" \
          "refs/tags/llvmorg-${{ steps.versions.outputs.llvm_version }}.[0-9][0-9]" \
          | awk '{print $2}' \
          | sed -E 's/refs\/tags\/llvmorg-${{ steps.versions.outputs.llvm_version }}.([0-9]+)/\1/' \
          | sort -n \
          | tail -1)
          echo "llvm_patch=${LLVM_PATCH}" >> $GITHUB_OUTPUT
      # Build, sign and attest the release assets before publishing the release
      # so a failure here leaves no tag behind and the job can simply be rerun.
      - name: Create source archive
        id: sign
        if: ${{ steps.versions.outputs.commits_since_last_release != 0 }}
        env:
          TAG: v${{ steps.versions.outputs.release_version }}
          COMMIT: ${{ steps.versions.outputs.last_commit }}
        run: |
          mkdir -p "${RUNNER_TEMP}/signing"
          ARCHIVE="${RUNNER_TEMP}/signing/opencl-clang-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="opencl-clang-${TAG}/" \
            -o "${ARCHIVE}" "${COMMIT}"
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
      - name: Sign source archive
        if: ${{ steps.versions.outputs.commits_since_last_release != 0 }}
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ${{ steps.sign.outputs.archive }}
          release-signing-artifacts: false
      # The OIDC ref/sha of a scheduled run is the default branch, not the
      # release branch, so bind the provenance to the archived commit explicitly.
      - name: Write SLSA provenance predicate
        id: predicate
        if: ${{ steps.versions.outputs.commits_since_last_release != 0 }}
        env:
          COMMIT: ${{ steps.versions.outputs.last_commit }}
          BRANCH: ${{ matrix.branch }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_ID: ${{ github.repository_id }}
          OWNER_ID: ${{ github.repository_owner_id }}
          RUNNER_ENV: ${{ runner.environment }}
        run: |
          PREDICATE="${RUNNER_TEMP}/signing/predicate.json"
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/patch-release.yml"
          jq -n \
            --arg buildType "https://actions.github.io/buildtypes/workflow/v1" \
            --arg ref "${GITHUB_REF}" \
            --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --arg path ".github/workflows/patch-release.yml" \
            --arg event "${EVENT_NAME}" \
            --arg repoId "${REPOSITORY_ID}" \
            --arg ownerId "${OWNER_ID}" \
            --arg runnerEnv "${RUNNER_ENV}" \
            --arg builderId "${WORKFLOW_URL}@${GITHUB_REF}" \
            --arg invocationId "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            --arg runUri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@${GITHUB_REF}" \
            --arg runSha "${GITHUB_SHA}" \
            --arg uri "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@refs/heads/${BRANCH}" \
            --arg commit "${COMMIT}" \
            '{buildDefinition: {buildType: $buildType,
                                externalParameters:
                                  {workflow: {ref: $ref, repository: $repo,
                                              path: $path}},
                                internalParameters:
                                  {github: {event_name: $event,
                                            repository_id: $repoId,
                                            repository_owner_id: $ownerId,
                                            runner_environment: $runnerEnv}},
                                resolvedDependencies:
                                  [{uri: $runUri, digest: {gitCommit: $runSha}},
                                   {uri: $uri, digest: {gitCommit: $commit}}]},
              runDetails: {builder: {id: $builderId},
                           metadata: {invocationId: $invocationId}}}' \
            > "${PREDICATE}"
          echo "path=${PREDICATE}" >> $GITHUB_OUTPUT
      - name: Generate SLSA build provenance
        id: attest
        if: ${{ steps.versions.outputs.commits_since_last_release != 0 }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.sign.outputs.archive }}
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ steps.predicate.outputs.path }}
      - name: Stage release assets
        if: ${{ steps.versions.outputs.commits_since_last_release != 0 }}
        env:
          ARCHIVE: ${{ steps.sign.outputs.archive }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" "${ARCHIVE}.intoto.jsonl"
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ steps.versions.outputs.commits_since_last_release != 0 }}
        with:
            # Setting tag to have format:
            # %latest llvm version%.%latest patch + 1%
            tag_name: v${{ steps.versions.outputs.release_version }}
            # We have to set this so tag is set on the branch we are releasing
            target_commitish: ${{ steps.versions.outputs.last_commit }}
            # We don't want to mark patch releases latest unless it is latest
            # major version
            make_latest: >-
              ${{ needs.setup.outputs.latest_branch == matrix.branch }}
            name: >
              opencl-clang linked against LLVM 
              v${{ steps.versions.outputs.llvm_version }}
              libraries
            # TODO: update
            body: "This release is linked against LLVM \
              v${{ steps.versions.outputs.llvm_version }}.${{ steps.llvm-spirv-versions.outputs.llvm_patch }} \
              and SPIR-V LLVM translator \
              v${{ steps.versions.outputs.llvm_version }}.${{ steps.llvm-spirv-versions.outputs.spirv_patch }}. \
              Full Changelog: ${{ github.server_url }}/\
              ${{ github.repository }}/compare/\
              ${{ steps.versions.outputs.latest_version }}...\
              v${{ steps.versions.outputs.release_version }}"
            files: |
              ${{ steps.sign.outputs.archive }}
              ${{ steps.sign.outputs.archive }}.sigstore.json
              ${{ steps.sign.outputs.archive }}.intoto.jsonl
